name: medgemma-27b

services:
  medgemma-27b:
    image: vllm/vllm-openai:latest
    container_name: medgemma-27b
    ipc: host
    ports:
      - "8000:8000"
    env_file:
      - ../../../.env
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./tool_chat_template_medgemma.jinja:/templates/tool_chat_template_medgemma.jinja:ro
    environment:
      VLLM_ENFORCE_STRICT_TOOL_CALLING: "true"
    command:
      - "--model=google/medgemma-27b-text-it"
      - "--served-model-name=medgemma-27b"
      - "--dtype=bfloat16"
      - "--tensor-parallel-size=${VLLM_TENSOR_PARALLEL_SIZE:-2}"
      - "--max-model-len=32768"
      - "--gpu-memory-utilization=0.90"
      - "--max-num-seqs=16"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser=hermes"
      - "--chat-template=/templates/tool_chat_template_medgemma.jinja"
      - "--host=0.0.0.0"
      - "--port=8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s
    restart: unless-stopped

volumes:
  hf-cache:
