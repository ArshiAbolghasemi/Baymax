[alembic]
script_location = migrations
prepend_sys_path = .

# Migration filenames sort chronologically, so `ls migrations/versions` reads
# as a history: 20260813_0210_initial_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# No sqlalchemy.url here on purpose — migrations/env.py takes it from
# DATABASE_URL through the application config, so the app and its migrations
# can never disagree about which database they mean.

# Logging is configured by hiro.common.logging in env.py, so the usual
# [loggers]/[handlers] blocks are deliberately absent.
