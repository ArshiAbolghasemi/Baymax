[project]
name = "bashmax"
version = "0.1.0"
description = "Terminal client for the hiro chat API"
requires-python = ">=3.14"
# A pure HTTP client. It deliberately shares nothing with hiro: no database
# driver, no broker, no model SDK — just enough to stream from an endpoint.
dependencies = [
    "httpx==0.28.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# The prompt glyphs (› ·) are deliberate terminal decoration, not typos.
"cli/render.py" = ["RUF001"]
