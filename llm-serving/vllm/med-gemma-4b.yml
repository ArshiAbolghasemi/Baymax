name: medgemma-4b

services:
  medgemma-4b:
    image: vllm/vllm-openai:latest
    container_name: medgemma-4b
    ipc: host
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    volumes:
      - hf-cache:/root/.cache/huggingface
    command:
      - "--model=google/medgemma-4b-it"
      - "--served-model-name=medgemma-4b"
      - "--dtype=bfloat16"
      - "--max-model-len=32768"
      - "--gpu-memory-utilization=0.60"
      - "--max-num-seqs=64"
      - "--host=0.0.0.0"
      - "--port=8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped

volumes:
  hf-cache:
