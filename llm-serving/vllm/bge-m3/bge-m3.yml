name: bge-m3

services:
  bge-m3:
    image: vllm/vllm-openai:latest
    container_name: bge-m3
    ipc: host
    ports:
      - "8001:8000"
    environment:
      - HF_HOME=/root/.cache/huggingface
    env_file:
      - ../../../.env
    volumes:
      - hf-cache:/root/.cache/huggingface
    command:
      - "--model=BAAI/bge-m3"
      - "--served-model-name=bge-m3"
      - "--runner=pooling"
      - "--dtype=float16"
      - "--max-model-len=8192"
      - "--gpu-memory-utilization=0.15"
      - "--max-num-seqs=256"
      - "--host=0.0.0.0"
      - "--port=8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

volumes:
  hf-cache:
